name: rolling-release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: the tag to use
        required: true
        type: string

permissions:
  contents: write
  id-token: write  # for Cosign keyless

jobs:
  validate-inputs:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag input
        env:
          TAG_INPUT: ${{ inputs.tag }}
        run: |
          echo "$TAG_INPUT" | grep -P '^(v\d+\.\d+\.\d+(-\S+)?|[^v\d].*)$' || {
            echo "Tag must follow semantic versioning (e.g. v1.2.3 or v1.2.3-beta)."
            echo "Provided tag: '$TAG_INPUT'"
            exit 1
          }

  build-linux-x86:
    needs: validate-inputs
    uses: ./.github/workflows/build-test-core-x86.yml

  build-linux-aarch64:
    needs: validate-inputs
    uses: ./.github/workflows/build-test-core-aarch64.yml

  build-osx-arm64:
    needs: validate-inputs
    uses: ./.github/workflows/build-test-osx.yml

  build-osx-x86:
    needs: validate-inputs
    uses: ./.github/workflows/build-test-osx.yml
    with:
      arch: x86_64

  build-windows-x86:
    needs: validate-inputs
    uses: ./.github/workflows/build-test-windows-x86.yml

  release:
    runs-on: ubuntu-latest

    needs:
      - build-linux-x86
      - build-linux-aarch64
      - build-osx-arm64
      - build-osx-x86
      - build-windows-x86

    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4
        with:
          # merge-multiple: true
          path: artifacts/

      - name: Display structure of downloaded files
        run: ls -R

      - name: Prepare binaries
        run: |
          pushd artifacts/

          tar xzf ./opengrep-linux-x86/opengrep.tgz --strip=1
          mv opengrep opengrep_linux_x86

          tar xzf ./opengrep-linux-aarch64/opengrep.tgz --strip=1
          mv opengrep opengrep_linux_aarch64

          tar xzf ./opengrep-osx-x86/opengrep.tgz --strip=1
          mv opengrep opengrep_osx_x86

          tar xzf ./opengrep-osx-arm64/opengrep.tgz --strip=1
          mv opengrep opengrep_osx_arm64

          # The Windows assets are flat: the exe and its DLLs side by side.
          tar xzf ./opengrep-windows-x86/opengrep.tgz
          zip -j opengrep_windows_x86.zip opengrep/*

          ls -l

          popd

      - name: Check the binaries to sign
        run: |
          pushd artifacts/

          for bin in opengrep_linux_x86 opengrep_linux_aarch64 \
                     opengrep_osx_x86 opengrep_osx_arm64; do
            if [ ! -x "$bin" ]; then
              echo "$bin is not executable" 1>&2
              exit 1
            fi
          done

          entries=$(unzip -Z1 opengrep_windows_x86.zip)
          echo "$entries"
          echo "$entries" | grep -qx 'opengrep.exe' || {
            echo "opengrep_windows_x86.zip does not hold opengrep.exe" 1>&2
            exit 1
          }
          dlls=$(echo "$entries" | grep -c '\.dll$' || true)
          if [ "$dlls" -ne 6 ]; then
            echo "Expected 6 DLLs in opengrep_windows_x86.zip, found $dlls" 1>&2
            exit 1
          fi

          popd

      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign all binaries in artifacts
        run: |
          files_to_sign=(
            artifacts/opengrep_linux_x86
            artifacts/opengrep_linux_aarch64
            artifacts/opengrep_osx_x86
            artifacts/opengrep_osx_arm64
            artifacts/opengrep_windows_x86.zip)
          for bin in "${files_to_sign[@]}"; do
            echo "Signing $bin..."
            cosign sign-blob \
              --yes \
              --output-signature "$bin.sig" \
              --output-certificate "$bin.cert" \
              "$bin"
          done

      - name: Create or Update Rolling Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Release from `${{ github.ref_name }}`
          draft: true
          prerelease: true
          generate_release_notes: true
          files: |
            artifacts/opengrep_linux_x86
            artifacts/opengrep_linux_x86.cert
            artifacts/opengrep_linux_x86.sig
            artifacts/opengrep_linux_aarch64
            artifacts/opengrep_linux_aarch64.cert
            artifacts/opengrep_linux_aarch64.sig
            artifacts/opengrep_osx_x86
            artifacts/opengrep_osx_x86.cert
            artifacts/opengrep_osx_x86.sig
            artifacts/opengrep_osx_arm64
            artifacts/opengrep_osx_arm64.cert
            artifacts/opengrep_osx_arm64.sig
            artifacts/opengrep_windows_x86.zip
            artifacts/opengrep_windows_x86.zip.cert
            artifacts/opengrep_windows_x86.zip.sig
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
