name: build-test-manylinux
on:
  workflow_call:
    inputs:
      arch:
        description: "Architecture (x86_64 or aarch64)"
        required: false
        default: "x86_64"
        type: string
  workflow_dispatch: null
  # workflow_run:
  #   workflows:
  #     - build-test-core-x86
  #   types:
  #     - completed
  #   branches:
  #     - main
  #     - linux/**
  #     - dm/linux-static-build-workflow
  # push:
  #   branches:
  #     - main
  #     - linux/**
  #     - dm/linux-static-build-workflow # branch where this change was introduced

jobs:

  # The Linux binary is built against musl in an alpine container; this checks
  # that the static executable also runs on glibc.
  test-binary:
    container: ${{ inputs.arch == 'x86_64' && 'quay.io/pypa/manylinux_2_28_x86_64' || 'quay.io/pypa/manylinux_2_28_aarch64' }}
    runs-on: ${{ inputs.arch == 'x86_64' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    steps:
      - name: Make checkout speedy
        run: git config --global fetch.parallel 50
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # ratchet:actions/checkout@v4
        with:
          submodules: false
      - name: Configure git safedir properly
        run: git config --global --add safe.directory "$(pwd)"
      - uses: actions/download-artifact@b14cf4c92620c250e1c074ab0a5800e37df86765 # ratchet:actions/download-artifact@v4
        with:
          name: opengrep-linux-${{ inputs.arch == 'x86_64' && 'x86' || 'aarch64' }}
      - run: tar xzf opengrep.tgz
      - name: test version output
        run: ./opengrep/opengrep --version
      - name: scan a fixture of this repository
        # --error is what turns findings into an exit code of 1
        run: |
          set +e
          ./opengrep/opengrep scan --error --json \
            -f tests/scan/rules/eqeq.yaml tests/scan/targets/basic/stupid.py \
            > findings.json
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "Expected an exit code of 1 for a scan with findings, got $status" 1>&2
            exit 1
          fi
          grep -Eq '"results": *\[ *\{' findings.json || {
            echo "Expected a non-empty results array" 1>&2
            exit 1
          }

