name: build-test-core-x86
on:
  push:
    branches:
      - main
      - linux/**
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_call: null
  workflow_dispatch: null

# concurrency:
#   group: ${{ github.workflow }}-${{ github.ref }}
#   cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:

  build-core:
    strategy:
      matrix:
        ocaml_version: ["5.5.1"]
    runs-on: ubuntu-latest

    steps:
      - name: Make checkout speedy
        run: git config --global fetch.parallel 50

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Configure git safedir properly
        run: git config --global --add safe.directory $(pwd)

      - name: Compute OPAM cache fingerprint
        run: ./scripts/opam-cache-fingerprint.sh

      - name: Set GHA cache for OPAM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-v2-opam-${{ matrix.ocaml_version }}-${{ hashFiles('.ci-cache/opam-fingerprint.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-v2-opam-${{ matrix.ocaml_version }}-
          path: _opam

      - name: Set SHOULD_INIT_OPAM based on Cache
        run: |
          if [ -d _opam ]; then
            echo "SHOULD_INIT_OPAM=false" >> $GITHUB_ENV
          fi

      - name: Run build inside container
        run: |
          docker run --rm \
            --volume ${{ github.workspace }}:/workspace \
            --env SHOULD_INIT_OPAM=${{ env.SHOULD_INIT_OPAM }} \
            --env OCAML_VERSION=${{ matrix.ocaml_version }} \
            --workdir /workspace \
            alpine:3.22 \
            sh -c \
            "set -e;
             mkdir -p _opam;
             chown -R root:root /workspace/_opam;
             ./scripts/workflow-build-inside-alpine-container.sh;
             chown -R $(id -u):$(id -g) /workspace/_opam"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opengrep-build-linux-x86
          path: artifacts.tgz

      # A tarball rather than a bare file, so that the executable bit survives
      # the upload.
      - name: Make artifact for ./bin/opengrep
        run: |
          mkdir opengrep
          cp ./bin/opengrep opengrep/
          tar czf opengrep.tgz opengrep

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opengrep-linux-x86
          path: opengrep.tgz

  build-test-manylinux-x86:
    needs:
      - build-core
    uses: ./.github/workflows/build-test-manylinux.yml
