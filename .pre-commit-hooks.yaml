# See https://pre-commit.com/#new-hooks for more information on this file.
# It allows to call opengrep from pre-commit

# This hook does not use 'docker_image' like the one below, and so is significantly
# faster (especially on macOS).
- id: semgrep
  name: semgrep
  entry: opengrep scan
  # 'language: system' runs the opengrep binary already on PATH; the hook
  # installs nothing. See INSTALL.md for how to get that binary.
  #
  # This used to be 'language: python', which made pre-commit build an
  # environment from a toplevel './setup.py' defined just for it, whose job
  # was to run 'pip install semgrep==0.xxx.yyy'. Opengrep is a single native
  # binary and is not published on PyPI, so there is nothing to pip-install.
  language: system
  args: ["--disable-version-check", "--quiet", "--skip-unknown-extensions"]

- id: semgrep-ci
  name: semgrep
  entry: opengrep ci
  # See above about why we need this
  language: system
  # Needed as ci command does not accept filenames as parameters
  pass_filenames: false
  # '--dry-run' is not an option of 'opengrep ci': there is no service the
  # findings could be uploaded to, so every run is already a dry run.
  args: ["--baseline-commit", "HEAD"]
