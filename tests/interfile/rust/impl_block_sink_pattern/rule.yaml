rules:
  - id: impl-block-sink-pattern
    languages: [rust]
    message: tainted data reaches a sink inside an impl block
    severity: ERROR
    mode: taint
    options:
      taint_interfile: true
    pattern-sources:
      - pattern: source()
    pattern-sinks:
      - patterns:
          - pattern: sink($X)
          - pattern-inside: |
              impl $T {
                ...
              }
