rules:
  - id: multi_clause_elixir_taint
    options:
      taint_interfile: true
    message: Multi-clause Elixir cross-function taint
    languages:
      - elixir
    severity: ERROR
    mode: taint
    pattern-sources:
      - pattern: source()
    pattern-sinks:
      - patterns:
          - pattern: sink($X)
