rules:
  - id: hidden-name-not-bound-by-wildcard-parent
    languages: [scala]
    message: Tainted data reaches a sink in the parent class that the wildcard import without a hiding clause binds
    severity: ERROR
    mode: taint
    options:
      taint_interfile: true
    pattern-sources:
      - pattern: source()
    pattern-sinks:
      - pattern: sink(...)
