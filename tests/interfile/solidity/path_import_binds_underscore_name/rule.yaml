rules:
  - id: path-import-binds-underscore-name
    languages: [solidity]
    message: Tainted data reaches a function whose name begins with an underscore through a path import
    severity: ERROR
    mode: taint
    options:
      taint_interfile: true
    pattern-sources:
      - pattern: source()
    pattern-sinks:
      - pattern: sink(...)
