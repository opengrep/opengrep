rules:
  - id: private-member-of-part-file-inherited
    languages: [dart]
    message: Tainted data reaches a private member of a part file of the same library through a bare name
    severity: ERROR
    mode: taint
    options:
      taint_interfile: true
    pattern-sources:
      - pattern: source()
    pattern-sinks:
      - pattern: sink(...)
