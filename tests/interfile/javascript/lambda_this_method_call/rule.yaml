rules:
  - id: lambda_this_method_call
    languages: [js]
    severity: ERROR
    message: A function argument reaches the fs module
    mode: taint
    options:
      taint_interfile: true
    pattern-sources:
      - patterns:
          - pattern-inside: function ... (..., $ARG,...) {...}
          - focus-metavariable: $ARG
    pattern-sinks:
      - patterns:
          - pattern-inside: |
              $FS = require('fs')
              ...
          - pattern-not: $FS. ... .$METHOD("...", ...)
          - pattern-either:
              - pattern: $FS. ... .readFileSync($FILE, ...)
              - pattern: $FS. ... .writeFileSync($FILE, ...)
