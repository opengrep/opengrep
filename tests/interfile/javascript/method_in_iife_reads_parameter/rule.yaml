rules:
  - id: method_in_iife_reads_parameter
    languages: [js]
    severity: ERROR
    message: probe
    mode: taint
    options:
      taint_interfile: true
    pattern-sources:
      - patterns:
          - pattern-inside: |
              function (..., $INPUT, ...) {
                ...
              }
          - focus-metavariable: $INPUT
    pattern-sinks:
      - pattern: sink($X)
