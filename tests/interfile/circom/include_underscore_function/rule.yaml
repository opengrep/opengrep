rules:
  - id: test-circom-include-underscore
    languages: [circom]
    message: Tainted data reaches a sink through a function of an included file whose name begins with an underscore
    severity: ERROR
    mode: taint
    options:
      taint_interfile: true
    pattern-sources:
      - pattern: source()
    pattern-sinks:
      - pattern: sink(...)
