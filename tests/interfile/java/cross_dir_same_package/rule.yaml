rules:
  - id: test-cross-dir-same-package
    languages: [java]
    message: |
      Same-package visibility across directories.  Two files declare
      [package com.example;] but live in different directories under
      the project root.  Without explicit imports, Helper#sink in
      dir2/Helper.java must still be reachable from Main.java in
      dir1/ via the [Per_package] visibility scope.
    severity: ERROR
    mode: taint
    options:
      taint_interfile: true
    pattern-sources:
      - pattern: source()
    pattern-sinks:
      - pattern: sink(...)
