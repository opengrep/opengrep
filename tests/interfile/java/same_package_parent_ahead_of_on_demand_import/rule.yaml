rules:
  - id: same-package-parent-ahead-of-on-demand-import
    languages: [java]
    message: Tainted data reaches a sink in the parent class of the own package
    severity: ERROR
    mode: taint
    options:
      taint_interfile: true
    pattern-sources:
      - pattern: source()
    pattern-sinks:
      - pattern: sink(...)
