rules:
  - id: test-sanitiser
    languages: [vb]
    message: Tainted data reaches a sink after a cross-file sanitizer
    severity: ERROR
    mode: taint
    options:
      taint_interfile: true
    pattern-sources:
      - pattern: Source()
    pattern-sinks:
      - pattern: Sink($X)
    pattern-sanitizers:
      - pattern: Sanitize($X)
