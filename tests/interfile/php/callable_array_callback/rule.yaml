rules:
  - id: callable-array-callback
    languages: [php]
    severity: ERROR
    message: >
      A callable written as the array `[$obj, 'handle']` names the method
      `handle` of the receiver's class, so the sinking `App\\Store::handle`
      runs and the same-named `Lib\\Store::handle` does not.
      The call graph resolves the callable to `App\\Store::handle`, and the
      lowering replaces the callable by a reference that carries this
      resolution.
    mode: taint
    options:
      taint_interfile: true
    pattern-sources:
      - pattern: $_GET[...]
    pattern-sinks:
      - pattern: sink(...)
