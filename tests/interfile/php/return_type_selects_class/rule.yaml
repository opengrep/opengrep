rules:
  - id: return-type-selects-class
    languages: [php]
    severity: ERROR
    message: >
      The declared return type of `make`, written `App\\Store`, names the class
      whose `run` the chained call reaches.
    mode: taint
    options:
      taint_interfile: true
    pattern-sources:
      - pattern: $_GET[...]
    pattern-sinks:
      - pattern: sink(...)
