rules:
  - id: callable-string-callback
    languages: [php]
    severity: ERROR
    message: >
      A callable written as the string `'App\\handle'` names the function of
      that qualified name, so the sinking `App\\handle` runs and the
      same-named `Lib\\handle` does not.
      The call graph resolves the callable to `App\\handle`, and the
      lowering replaces the callable by a reference that carries this
      resolution.
    mode: taint
    options:
      taint_interfile: true
    pattern-sources:
      - pattern: $_GET[...]
    pattern-sinks:
      - pattern: sink(...)
