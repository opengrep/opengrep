rules:
  - id: homonym-class-require
    languages: [php]
    severity: ERROR
    message: >
      Taint reaches a sink through a method of a class whose name is shared
      by an unrelated class in another file.  Pins homonym handling for
      require-based languages: the caller's own require_once names the file
      its Widget lives in, so the same-arity method collision with the
      unrelated widget_a.php must not drop the call (a silent cross-file
      false negative).
    mode: taint
    options:
      taint_interfile: true
    pattern-sources:
      - pattern: taint(...)
    pattern-sinks:
      - pattern: sink(...)
