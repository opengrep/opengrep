rules:
  - id: test-permit-homonym
    mode: taint
    languages:
      - ruby
    message: "Taint through a private method's permit chain must not be killed by resolving permit to a same-named free function"
    severity: ERROR
    options:
      taint_interfile: true
    pattern-sources:
      - pattern: params
    pattern-sinks:
      - pattern: sink(...)
