rules:
  - id: test-bash-source-underscore
    languages: [bash]
    message: Tainted data reaches eval through a function of a sourced file whose name begins with an underscore
    severity: ERROR
    mode: taint
    options:
      taint_interfile: true
    pattern-sources:
      - pattern: $(get_input)
    pattern-sinks:
      - pattern: eval ...
