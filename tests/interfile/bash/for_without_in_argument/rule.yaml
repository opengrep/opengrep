rules:
  - id: test-bash-for-without-in-argument
    languages: [bash]
    message: Tainted data reaches eval through the words a for loop without in iterates over
    severity: ERROR
    mode: taint
    options:
      taint_interfile: true
    pattern-sources:
      - pattern: $(get_input)
    pattern-sinks:
      - pattern: eval ...
