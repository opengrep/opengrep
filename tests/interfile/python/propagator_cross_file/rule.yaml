rules:
  - id: propagator-cross-file
    languages: [python]
    severity: ERROR
    message: taint reaches the sink through a container filled in another file
    mode: taint
    options:
      taint_interfile: true
    pattern-sources:
      - pattern: source()
    pattern-sinks:
      - pattern: sink(...)
    pattern-propagators:
      - pattern: $BOX.append($V)
        from: $V
        to: $BOX
