rules:
  - id: own-class-parent-ahead-of-star-import
    languages: [python]
    message: Tainted data reaches a sink in the parent class defined in the module
    severity: ERROR
    mode: taint
    options:
      taint_interfile: true
    pattern-sources:
      - pattern: source()
    pattern-sinks:
      - pattern: sink(...)
