rules:
  - id: depth-unbounded
    languages: [python]
    severity: ERROR
    message: >
      The same rule with a depth of three of its own, for a depth set by the
      scan to override.
    mode: taint
    options:
      taint_interfile: true
      taint_interfile_depth: 3
    pattern-sources:
      - pattern: source()
    pattern-sinks:
      - pattern: sink(...)
