rules:
  - id: dunder-all-star-import-not-parent
    languages: [python]
    message: Tainted data reaches a sink in the parent class of the star import whose __all__ lists it
    severity: ERROR
    mode: taint
    options:
      taint_interfile: true
    pattern-sources:
      - pattern: source()
    pattern-sinks:
      - pattern: sink(...)
