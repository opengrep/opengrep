rules:
  - id: later-of-star-and-named-import-binds-parent
    languages: [python]
    message: Tainted data reaches a sink in the parent class that the later import binds
    severity: ERROR
    mode: taint
    options:
      taint_interfile: true
    pattern-sources:
      - pattern: source()
    pattern-sinks:
      - pattern: sink(...)
