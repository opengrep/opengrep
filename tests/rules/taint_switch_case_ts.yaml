rules:
- id: taint-switch-case-ts
  mode: taint
  pattern-sources:
    - pattern: |
        taint_source()
  pattern-sinks:
    - pattern: |
        sink(...)
  message: Tainted value reaches sink
  severity: WARNING
  languages: [ts]
- id: switch-case-constant-propagation-ts
  pattern: exec(7)
  message: Case labels preserve the constant binding
  severity: WARNING
  languages: [ts]
- id: switch-case-command-constant-ts
  pattern: exec("rm")
  message: Case labels preserve the command constant
  severity: WARNING
  languages: [ts]
