rules:
- id: taint-switch-case-cpp
  mode: taint
  pattern-sources:
    - pattern: |
        taint_source()
  pattern-sinks:
    - pattern: |
        sink(...)
  message: Tainted value reaches sink
  severity: WARNING
  languages: [cpp]
- id: switch-case-constant-propagation-cpp
  pattern: exec(7)
  message: Case labels preserve the constant binding
  severity: WARNING
  languages: [cpp]
