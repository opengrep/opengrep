rules:
  - id: test-module-global-source-python
    message: |
      A module-level global assigned from a source reaches a sink inside a
      function that never appears in a call chain with the source.
    languages: [python]
    severity: WARNING
    mode: taint
    options:
      taint_intrafile: true
    pattern-sources:
      - pattern: source()
    pattern-sinks:
      - pattern: sink(...)
