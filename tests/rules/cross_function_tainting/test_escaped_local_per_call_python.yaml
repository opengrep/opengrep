rules:
  - id: test-escaped-local-per-call-python
    message: Each call of a function creates its own locals, which the closures it returns share
    languages:
      - python
    severity: WARNING
    mode: taint
    options:
      taint_intrafile: true
    pattern-sources:
      - pattern: source()
    pattern-sinks:
      - pattern: sink(...)
