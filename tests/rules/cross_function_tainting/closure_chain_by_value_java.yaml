rules:
  - id: closure_chain_by_value_java
    message: a function that a loop composes from the previous one, captured by value, carries its argument to the sink
    languages:
      - java
    severity: WARNING
    mode: taint
    options:
      taint_intrafile: true
    pattern-sources:
      - pattern: source()
    pattern-sinks:
      - pattern: sink(...)
