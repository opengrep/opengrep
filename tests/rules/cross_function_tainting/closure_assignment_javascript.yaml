rules:
  - id: closure_assignment_javascript
    message: an assignment to a captured variable inside a function literal reaches the enclosing function when the literal is called
    languages:
      - javascript
    severity: WARNING
    mode: taint
    options:
      taint_intrafile: true
    pattern-sources:
      - pattern: source()
    pattern-sinks:
      - pattern: sink(...)
