rules:
  - id: trace_flag_longer_then_branch_python
    message: a command-line argument reaches the command of a child process
    languages:
      - python
    severity: WARNING
    mode: taint
    options:
      taint_intrafile: true
    pattern-sources:
      - pattern: $PARSER.parse_args(...)
    pattern-sinks:
      - patterns:
          - pattern: subprocess.run($CMD, ...)
          - focus-metavariable: $CMD
