rules:
  - id: test-param-rebinding-per-path-js
    message: A write through a parameter reaches the caller when the parameter may still refer to the caller's object
    languages:
      - javascript
    severity: WARNING
    mode: taint
    options:
      taint_intrafile: true
    pattern-sources:
      - pattern: source(...)
    pattern-sinks:
      - pattern: sink(...)
