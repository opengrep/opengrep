rules:
  - id: test-nested-definition-time-python
    message: a nested function captures the variables its decorators and default values bind in the enclosing function
    languages:
      - python
    severity: WARNING
    mode: taint
    options:
      taint_intrafile: true
    pattern-sources:
      - pattern: source()
    pattern-sinks:
      - pattern: sink(...)
