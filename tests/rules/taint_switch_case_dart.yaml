rules:
- id: taint-switch-case-dart
  mode: taint
  pattern-sources:
    - pattern: taint_source()
  pattern-sinks:
    - pattern: sink(...)
  message: Tainted value reaches sink
  severity: WARNING
  languages: [dart]
- id: switch-case-constant-propagation-dart
  pattern: exec(7)
  message: Case labels preserve the constant binding
  severity: WARNING
  languages: [dart]
