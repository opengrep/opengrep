rules:
- id: taint-switch-case-go
  mode: taint
  pattern-sources:
    - pattern: |
        taint_source()
  pattern-sinks:
    - pattern: |
        sink(...)
  message: Tainted value reaches sink
  severity: WARNING
  languages: [go]
- id: switch-case-constant-propagation-go
  pattern: exec(7)
  message: Case labels preserve the constant binding
  severity: WARNING
  languages: [go]
