rules:
  - id: precondition-fixpoint
    message: A sink's labelled precondition stays the same formula over the rounds of a fixpoint
    languages: [javascript]
    severity: WARNING
    mode: taint
    options:
      taint_intrafile: true
    pattern-sources:
      - label: A
        pattern: sourceA()
      - label: B
        pattern: sourceB()
    pattern-sinks:
      - requires: A and B
        pattern: sink(...)
