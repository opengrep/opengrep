rules:
  - id: destructuring-default-taint-loss
    languages: [javascript]
    severity: ERROR
    message: taint reached sink
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-inside: |
              function $_(..., $INPUT, ...) {
                ...
              }
          - focus-metavariable: $INPUT
    pattern-sinks:
      - pattern: sink(...)
