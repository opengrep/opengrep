rules:
  - id: extension_block_receiver_source
    message: "a parameter reaches the sink"
    languages:
      - csharp
    severity: ERROR
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-inside: |
              $RET $METHOD(..., $PARAM, ...) { ... }
          - focus-metavariable: $PARAM
    pattern-sinks:
      - pattern: |
          sink(...)
