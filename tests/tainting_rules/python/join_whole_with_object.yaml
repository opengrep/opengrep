rules:
  - id: join_whole_with_object
    message: taint through a value that is an object on one path and tainted as a whole on the other
    languages:
      - python
    severity: WARNING
    mode: taint
    pattern-sources:
      - pattern: self.path
    pattern-sanitizers:
      - pattern: sanitize(...)
    pattern-sinks:
      - pattern: sink(...)
