rules:
  - id: invalid-paths-glob
    pattern: $X == $X
    message: the glob is not valid
    languages: [python]
    severity: WARNING
    paths:
      include:
        - "[a.py"
  - id: valid-rule
    pattern: $X == $X
    message: the other rule of the file still runs
    languages: [python]
    severity: WARNING
